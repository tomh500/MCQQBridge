[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcqq-bridge"
version = "2.0.0"
license = {file = "LICENSE"}
description = "QQ official bot and Minecraft group bridge"
requires-python = ">=3.11"
dependencies = ["qq-botpy==1.2.1", "aiohttp>=3.10,<4"]
readme = "README.md"

[project.scripts]
mcqq = "mcqq.cli:main"

[tool.setuptools]
packages = ["mcqq"]
include-package-data = true

[tool.setuptools.package-data]
mcqq = ["settings.example.json"]
