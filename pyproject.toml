[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcqq-bridge"
version = "2.0.0"
license = {file = "LICENSE"}
description = "QQ official bot and Minecraft group bridge"
requires-python = ">=3.11"
dependencies = ["qq-botpy==1.2.1", "aiohttp>=3.10,<4", "PyMySQL>=1.1,<2", "pymongo>=4.10,<5", "redis>=5,<7", "PyYAML>=6,<7", "regex>=2024.11", "Pillow>=11,<14"]
readme = "README.md"

[project.scripts]
mcqq = "mcqq.cli:main"

[tool.setuptools]
packages = ["mcqq", "mcqq.plugins"]
include-package-data = true

[tool.setuptools.package-data]
mcqq = ["settings.example.json", "settings.example.yml", "waifu_catalog.json"]
"mcqq.plugins" = ["*.yml"]
